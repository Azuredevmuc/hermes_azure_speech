name: Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install project dependencies
        working-directory: ./Azure Speech Provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Lint with Ruff
        working-directory: ./Azure Speech Provider
        run: ruff check .

      - name: Run tests
        working-directory: ./Azure Speech Provider
        run: pytest -q

      - name: Build package
        working-directory: ./Azure Speech Provider
        run: python -m build

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        working-directory: ./Azure Speech Provider
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distribution artifacts
        working-directory: ./Azure Speech Provider
        run: python -m build

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Azure Speech Provider/dist/*

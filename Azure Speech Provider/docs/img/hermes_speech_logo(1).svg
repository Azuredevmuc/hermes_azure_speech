<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-label="Winged speech bubble audio logo">
  <defs>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63F7F0"/>
      <stop offset="0.5" stop-color="#20DDE7"/>
      <stop offset="1" stop-color="#18BFD8"/>
    </linearGradient>
    <linearGradient id="cyan2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75FFF3"/>
      <stop offset="1" stop-color="#0FC6DF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- soft cyan halo -->
  <g opacity="0.32" filter="url(#glow)" fill="none" stroke="#20E8E5" stroke-linecap="round" stroke-linejoin="round">

  <!-- waveform -->
  <g fill="url(#cyan)" filter="url(#glow)">
    <rect x="455" y="523" width="36" height="80" rx="18"/>
    <rect x="515" y="481" width="38" height="164" rx="19"/>
    <rect x="580" y="437" width="40" height="250" rx="20"/>
    <rect x="647" y="496" width="38" height="136" rx="19"/>

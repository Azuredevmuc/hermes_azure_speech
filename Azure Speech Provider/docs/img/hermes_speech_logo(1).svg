    <path d="M343 542 C286 534 237 512 191 486 C158 467 132 447 111 428 C124 466 151 493 190 511 C233 532 281 546 333 559 C340 561 344 554 343 542 Z"/>

    <path d="M823 438 C870 430 906 394 950 359 C1001 319 1068 282 1128 248 C1119 309 1083 353 1027 382 C969 411 914 434 853 458 C842 462 830 456 823 438 Z"/>
    <path d="M842 493 C898 484 952 453 1006 419 C1050 391 1088 360 1117 331 C1110 379 1081 413 1036 438 C982 468 922 486 859 511 C850 514 843 507 842 493 Z"/>
    <path d="M857 542 C914 534 963 512 1009 486 C1042 467 1068 447 1089 428 C1076 466 1049 493 1010 511 C967 532 919 546 867 559 C860 561 856 554 857 542 Z"/>

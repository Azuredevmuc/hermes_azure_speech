  <!-- speech bubble outline -->
  <path d="M371 437 C408 376 489 347 600 347 C711 347 792 376 829 437 C856 481 862 544 843 596 C821 657 767 695 697 720 C656 735 611 743 564 744 L445 821 L474 741 C405 725 357 692 331 643 C304 592 305 490 371 437 Z"
